name: ragline

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: llmbuilder
      POSTGRES_PASSWORD: llmbuilder
      POSTGRES_DB: llmbuilder
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U llmbuilder -d llmbuilder"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  qdrant:
    # v1.10+ required for query_points API used by qdrant-client
    image: qdrant/qdrant:v1.10.1
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    # No healthcheck: official image has no wget/curl; app/worker depend on container start only

  postfix:
    image: boky/postfix:latest
    environment:
      # Allow any sender domain (set ALLOWED_SENDER_DOMAINS to restrict in production)
      ALLOW_EMPTY_SENDER_DOMAINS: "true"
      # Optional: relay via external SMTP (e.g. Gmail, SendGrid). Leave unset for direct delivery.
      # RELAYHOST: smtp.gmail.com:587
      # RELAYHOST_USERNAME: your@gmail.com
      # RELAYHOST_PASSWORD: app-password
      # RELAYHOST_TLS_LEVEL: may
    ports:
      - "1025:587"
    restart: unless-stopped

  adminer:
    image: adminer:latest
    ports:
      - "8096:8080"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ADMINER_DEFAULT_SERVER: postgres

  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql://llmbuilder:llmbuilder@postgres:5432/llmbuilder
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      UPLOAD_DIR: /tmp/uploads
      # Ollama on host: use host.docker.internal (Mac/Windows). On Linux set model endpoint URL to host IP or use docker-compose.gpu.yml.
      OLLAMA_DEFAULT_URL: http://host.docker.internal:11434
      # Postfix in same stack: use for OTP emails (override in .env if using external SMTP)
      SMTP_HOST: postfix
      SMTP_PORT: 587
      SMTP_FROM_EMAIL: noreply@localhost
      SMTP_USE_TLS: "false"
    volumes:
      - uploads_data:/tmp/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
      postfix:
        condition: service_started
    ports:
      - "${RAGLINE_API_PORT:-8000}:8000"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    deploy:
      resources:
        limits: { cpus: "2", memory: "2G" }
        reservations: { cpus: "0.25", memory: "256M" }
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql://llmbuilder:llmbuilder@postgres:5432/llmbuilder
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      UPLOAD_DIR: /tmp/uploads
      OLLAMA_DEFAULT_URL: http://host.docker.internal:11434
      SMTP_HOST: postfix
      SMTP_PORT: 587
      SMTP_FROM_EMAIL: noreply@localhost
      SMTP_USE_TLS: "false"
    volumes:
      - uploads_data:/tmp/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
      postfix:
        condition: service_started
    command: python -m app.workers.runner
    deploy:
      resources:
        limits: { cpus: "2", memory: "4G" }
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    env_file: .env
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:${RAGLINE_API_PORT:-8000}}
    depends_on:
      - app
    ports:
      - "${RAGLINE_UI_PORT:-3000}:3000"
    restart: unless-stopped

volumes:
  postgres_data:
  qdrant_data:
  uploads_data:
