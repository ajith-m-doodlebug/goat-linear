name: ragline

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: llmbuilder
      POSTGRES_PASSWORD: llmbuilder
      POSTGRES_DB: llmbuilder
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U llmbuilder -d llmbuilder"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.10.1
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  adminer:
    image: adminer:latest
    ports:
      - "8096:8080"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ADMINER_DEFAULT_SERVER: postgres

  ingress:
    build:
      context: ./ingress
      dockerfile: Dockerfile
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${RAGLINE_API_PORT:-8005}:${RAGLINE_API_PORT:-8005}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      RAGLINE_API_PORT: ${RAGLINE_API_PORT:-8005}
      VLLM_PROXY_HOST: ${VLLM_PROXY_HOST:-host.docker.internal}
      VLLM_PROXY_PORT: ${VLLM_PROXY_PORT:-8010}
    restart: unless-stopped

  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file: .env
    environment:
      DATABASE_URL: postgresql://llmbuilder:llmbuilder@postgres:5432/llmbuilder
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      UPLOAD_DIR: /tmp/uploads
      OLLAMA_DEFAULT_URL: http://host.docker.internal:11434
      RAGLINE_UI_PORT: ${RAGLINE_UI_PORT:-3000}
      RAGLINE_API_PORT: ${RAGLINE_API_PORT:-8005}
    volumes:
      - uploads_data:/tmp/uploads
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    expose:
      - "8000"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    deploy:
      resources:
        limits: { cpus: "2", memory: "2G" }
        reservations: { cpus: "0.25", memory: "256M" }
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql://llmbuilder:llmbuilder@postgres:5432/llmbuilder
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      UPLOAD_DIR: /tmp/uploads
      OLLAMA_DEFAULT_URL: http://host.docker.internal:11434
      RAGLINE_UI_PORT: ${RAGLINE_UI_PORT:-3000}
      RAGLINE_API_PORT: ${RAGLINE_API_PORT:-8005}
    volumes:
      - uploads_data:/tmp/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    command: python -m app.workers.runner
    deploy:
      resources:
        limits: { cpus: "2", memory: "4G" }
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Browser calls API on RAGLINE_API_PORT (ingress: /api/ → app, /v1/ → vLLM).
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
        NEXT_PUBLIC_API_PORT: ${RAGLINE_API_PORT:-8005}
    env_file: .env
    environment:
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
      NEXT_PUBLIC_API_PORT: ${RAGLINE_API_PORT:-8005}
    depends_on:
      - app
      - ingress
    ports:
      - "${RAGLINE_UI_PORT:-3000}:3000"
    restart: unless-stopped

volumes:
  postgres_data:
  qdrant_data:
  uploads_data:
