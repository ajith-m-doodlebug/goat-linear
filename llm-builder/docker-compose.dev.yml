# Dev override: bind mounts + --reload + Next dev. Used by ./reload-start.sh (and ./stop.sh tears it down).

name: ragline

services:
  app:
    ports:
      # Optional: hit FastAPI directly while ingress serves the public RAGLINE_API_PORT.
      - "127.0.0.1:8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backend:/app
      - uploads_data:/tmp/uploads
      # Host Models: API shells out to docker against the host engine (same as base compose).
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      UPLOAD_DIR: /tmp/uploads
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    restart: "no"

  worker:
    volumes:
      - ./backend:/app
      - uploads_data:/tmp/uploads
    environment:
      UPLOAD_DIR: /tmp/uploads
    restart: "no"

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    volumes:
      - ./frontend:/app
      - web_node_modules:/app/node_modules
      # Keep .next off the bind mount: host .next is often missing, wrong arch, or stale vs Linux dev.
      - web_next:/app/.next
    restart: "no"
    environment:
      NODE_ENV: development
      HOSTNAME: "0.0.0.0"
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
      NEXT_PUBLIC_API_PORT: ${RAGLINE_API_PORT:-8005}
      WATCHPACK_POLLING: "true"

volumes:
  web_node_modules:
  web_next:
  uploads_data:
