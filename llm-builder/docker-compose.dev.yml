# Dev override: bind mounts + --reload + Next dev. Used by ./setup.sh, ./start.sh, ./stop.sh.

name: ragline

services:
  app:
    volumes:
      - ./backend:/app
      - uploads_data:/tmp/uploads
    environment:
      UPLOAD_DIR: /tmp/uploads
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    restart: "no"

  worker:
    volumes:
      - ./backend:/app
      - uploads_data:/tmp/uploads
    environment:
      UPLOAD_DIR: /tmp/uploads
    restart: "no"

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    volumes:
      - ./frontend:/app
      - web_node_modules:/app/node_modules
      # Keep .next off the bind mount: host .next is often missing, wrong arch, or stale vs Linux dev.
      - web_next:/app/.next
    restart: "no"
    environment:
      NODE_ENV: development
      HOSTNAME: "0.0.0.0"
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:${RAGLINE_API_PORT:-8000}}
      WATCHPACK_POLLING: "true"

volumes:
  web_node_modules:
  web_next:
  uploads_data:
